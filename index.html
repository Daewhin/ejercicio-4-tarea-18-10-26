<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 4 - Tabla de Precios y Planes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

    <div class="container py-4">
        <h2 class="text-center fw-bold mb-4">Planes de Suscripción</h2>

        <div class="row g-4 align-items-center">

            <div class="col-12 col-md-4">
                <div class="card bg-light border shadow-sm text-center p-4">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3">Básico</h3>
                        
                        <p class="display-4 fw-bold my-3">$19</p>
                        
                        <button class="btn btn-warning w-100 fw-bold btn-lg">Elegir</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card bg-primary text-white shadow p-4 border-0">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3">Pro VIP</h3>
                        
                        <p class="display-4 fw-bold my-3">$49</p>
                        
                        <button class="btn btn-warning w-100 fw-bold btn-lg">Elegir</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card bg-dark text-white border shadow-sm text-center p-4">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3">Enterprise</h3>
                        
                        <p class="display-4 fw-bold my-3">$99</p>
                        
                        <button class="btn btn-warning w-100 fw-bold btn-lg">Elegir</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
